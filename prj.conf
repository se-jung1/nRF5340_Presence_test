CONFIG_GPIO=y

# uart1 -> IWRL6432. Interrupt driven with a ring buffer: at 115200 the byte
# rate is ~11 kB/s worst case, which the app core absorbs without DMA.
# ponytail: if the profile ever gets heavy enough to overrun, switch to
# CONFIG_UART_ASYNC_API and double-buffered DMA rather than raising the ring.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# NVS write can run from the main thread here (nothing is time critical), but
# it plus printk wants more than the 1K default.
CONFIG_MAIN_STACK_SIZE=2048

# Occupancy records in internal flash (storage_partition, 160K)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Device id ("PR" + 6 hex of the factory id) for the frame and advertising name
CONFIG_HWINFO=y

# BLE peripheral. The controller runs on the network core - see Kconfig.sysbuild.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="SNTL"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=2048

# App asks for MTU 247 after connecting; smaller still works, just slower.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2
